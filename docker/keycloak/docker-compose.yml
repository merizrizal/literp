services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: literp-keycloak-local
    command:
      - start-dev
      - --import-realm
      - --hostname=https://localhost:8443
      - --https-certificate-file=/opt/keycloak/conf/tls/localhost-cert.pem
      - --https-certificate-key-file=/opt/keycloak/conf/tls/localhost-key.pem
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD before starting local Keycloak}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./certs:/opt/keycloak/conf/tls:ro
    mem_limit: 1g
